<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sty.css">
    <title>S-P-S</title>
</head>
<body>
    <h1>Stone Paper Scissors</h1>
    <div class="choices">
        <div class="choice">
            <img src="/image/rock.png" alt="Stone" id="Stone">
        </div>
        <div class="choice">
            <img src="/image/paper.png" alt="Paper" id="Paper">
        </div>
        <div class="choice">
            <img src="/image/scissors.png" alt="Scissors" id="Scissors">
        </div>
    </div>

    <div class="score-board">
        <div class="score" id="user-score">
            <p>0</p>
            <p>you</p>
        </div>
        <div class="score" id="comp-score">
            <p>0</p>
            <p>comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
